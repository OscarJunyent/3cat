# FUTURA MIGRACIÓ: Configuració Apache per a 3cat.elink.cat
# NOTA: Actualment la web es desplega a Hostinger via GitHub Actions.
#       Usar aquest fitxer si en el futur es migra a un VPS propi.
#
# Adaptació per a Astro amb rutes sense extensió
# Instal·lació: copiar a /etc/apache2/sites-available/3cat.elink.cat.conf
#              a2ensite 3cat.elink.cat && systemctl restart apache2

<VirtualHost *:80>
    ServerName 3cat.elink.cat
    ServerAlias www.3cat.elink.cat
    
    # ACME challenge per a certbot
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory /var/www/certbot>
        Require all granted
    </Directory>
    
    # Redirect tot el tràfic HTTP a HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName 3cat.elink.cat
    ServerAlias www.3cat.elink.cat
    
    # Ruta del codi Astro compilat
    DocumentRoot /var/www/3cat.elink.cat/dist
    
    # Certificat SSL (generat amb certbot)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/3cat.elink.cat/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/3cat.elink.cat/privkey.pem
    
    # Configuració SSL (recomanat)
    SSLProtocol TLSv1.2 TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on
    
    # Headers de seguretat
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://formspree.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; form-action 'self' https://formspree.io; frame-src 'none'; object-src 'none';"
    
    # Compressió Gzip
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain text/css text/xml 
                              text/javascript application/x-javascript 
                              application/xml+rss application/javascript 
                              application/json
    </IfModule>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/3cat.elink.cat.error.log
    CustomLog ${APACHE_LOG_DIR}/3cat.elink.cat.access.log combined
    
    # Astro generat URLs sense extensió
    # Per ex: /bloc-1 -> /bloc-1/index.html
    <Directory /var/www/3cat.elink.cat/dist>
        RewriteEngine On
        RewriteBase /
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . index.html [QSA,L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^(.*)$ $1.html [L]
        
        Require all granted
    </Directory>
    
    # Cache per a assets (imatges, CSS, JS)
    <FilesMatch "\.(jpg|jpeg|png|gif|svg|woff|woff2|ttf|js|css)$">
        Header set Cache-Control "max-age=31536000, public, immutable"
    </FilesMatch>
    
    # Cache per a PDFs
    <DirectoryMatch ^/var/www/3cat.elink.cat/dist/pdfs>
        Header set Cache-Control "max-age=2592000, public"
    </DirectoryMatch>
    
    # Cache per a screenshots
    <DirectoryMatch ^/var/www/3cat.elink.cat/dist/screenshots>
        Header set Cache-Control "max-age=2592000, public"
    </DirectoryMatch>
    
    # Deshabilitar cache per a HTML
    <FilesMatch "\.html$">
        Header set Cache-Control "no-cache, must-revalidate, max-age=0"
    </FilesMatch>
    
    # Denegar accés a fitxers sensibles
    <FilesMatch "^\.|~$">
        Require all denied
    </FilesMatch>
</VirtualHost>
