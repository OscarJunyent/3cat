# Configuració Nginx per a 3cat.elink.cat
# Adaptació per a Astro amb rutes sense extensió
# Instal·lació: copiar a /etc/nginx/sites-available/3cat.elink.cat
#              ln -s /etc/nginx/sites-available/3cat.elink.cat /etc/nginx/sites-enabled/
#              nginx -t && systemctl restart nginx

# Redirect HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 3cat.elink.cat www.3cat.elink.cat;
    
    # ACME challenge per a certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect tot el tràfic HTTP a HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 3cat.elink.cat www.3cat.elink.cat;
    
    # Ruta del codi Astro compilat
    root /var/www/3cat.elink.cat/dist;
    
    # Certificat SSL (generat amb certbot)
    ssl_certificate /etc/letsencrypt/live/3cat.elink.cat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3cat.elink.cat/privkey.pem;
    
    # Configuració SSL (recomanat)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Headers de seguretat
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://formspree.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; form-action 'self' https://formspree.io; frame-src 'none'; object-src 'none';" always;
    
    # Compressió Gzip
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;
    gzip_vary on;
    gzip_min_length 1000;
    
    # Index per defecte
    index index.html;
    
    # Logging
    access_log /var/log/nginx/3cat.elink.cat.access.log;
    error_log /var/log/nginx/3cat.elink.cat.error.log;
    
    # Astro generat URLs sense extensió: intentar index.html
    # Per ex: /bloc-1 -> /bloc-1/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    
    # Cache per a assets (imatges, CSS, JS)
    # Aquests fitxers hanno tenido un hash en el nom, així duran per sempre
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Cache per a PDFs
    location ~* ^/pdfs/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    
    # Cache per a screenshots
    location ~* ^/screenshots/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    
    # Deshabilitar cache per a HTML (sempre validar al servidor)
    location ~* \.html?$ {
        add_header Cache-Control "no-cache, must-revalidate, max-age=0";
    }
    
    # Denegar accés a fitxers sensibles
    location ~ /\. {
        deny all;
    }
    
    location ~ ~$ {
        deny all;
    }
}
