/**
 * NOTA: Aquest fitxer és una plantilla.
 * Per fer deploy a Cloudflare Pages, copia aquest fitxer a wrangler.toml
 * i completa els valors segons la teva configuració de Cloudflare.
 */

name = "3cat-elink-portal"
main = "dist/index.js"
compatibility_date = "2024-01-01"

# Vincula el projecte a Cloudflare Pages
[env.production]
routes = [
  { pattern = "3cat.elink.cat", zone_name = "elink.cat" }
]

# Variables d'entorn (opcional)
[env.production.vars]
SITE_NAME = "3Cat × Elink"
BRAND_COLOR = "#D63B3B"

# Per fer deploy localment:
# npm run build && wrangler pages deploy ./dist
